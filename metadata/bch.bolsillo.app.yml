Summary: Billetera de autocustodia de Bitcoin Cash, simple y en pesos
Description: |-
  Bolsillo BCH es una billetera de autocustodia para Bitcoin Cash pensada
  para usuarios que no son cripto-entusiastas.

  Tus claves y tu frase semilla se guardan unicamente en tu dispositivo,
  cifrados. La app no tiene cuentas ni registro: vos sos el dueno de tus
  fondos.

  Incluye copia de seguridad opcional y cifrada en tu propio Google Drive,
  montos en pesos argentinos, modo estable y una interfaz minimalista.

  Esta es una version adaptada del proyecto Selene Wallet.
